<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrickCircle — Build. Exchange. Repeat.</title><style>:root{--bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#e5e7eb;--brand:#ffcf33;--dark:#111827;--ok:#0f9d58}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.nav{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.logo{font-weight:900;font-size:22px}.logo span{background:var(--brand);padding:5px 9px;border-radius:9px;margin-right:7px}.links{display:flex;gap:4px}.links button{background:none;border:0;padding:10px;color:var(--muted);border-radius:9px}.links button:hover{background:#f2f4f7;color:var(--ink)}main{max-width:1180px;margin:auto;padding:34px 22px 70px}.hero{background:linear-gradient(135deg,#fff,#fff8d9);border:1px solid #f0e4a5;border-radius:24px;padding:50px 42px;display:grid;grid-template-columns:1.3fr .7fr;gap:30px}.hero h1{font-size:50px;line-height:1;letter-spacing:-2px;margin:15px 0}.hero p{font-size:19px;color:var(--muted);max-width:650px}.primary{background:var(--dark);color:#fff;border:0;padding:11px 16px;border-radius:9px;font-weight:750}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);padding:11px 16px;border-radius:9px;font-weight:700}.cta,.actions{display:flex;gap:9px;margin-top:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 3px 12px #1018280a}.heroCard{align-self:center}.swap{display:flex;align-items:center;gap:8px}.mini{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px}.emoji{font-size:48px}.grid,.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.section{margin-top:32px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h2{margin:0}.muted{color:var(--muted)}.small{font-size:13px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#f2f4f7;color:#475467;font-size:12px;font-weight:700}.ok{background:#ecfdf3;color:#027a48}.hot{background:#fff3d6;color:#9a6700}.setIcon{height:120px;background:#f8fafc;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:64px;margin-bottom:12px}.top{display:flex;justify-content:space-between}.toolbar{display:flex;gap:10px;margin-bottom:18px}.toolbar input,.toolbar select,.form input,.form select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff}.toolbar input{max-width:500px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:17px;background:#fff;border:1px solid var(--line);border-radius:14px}.stat b{display:block;font-size:27px;margin-top:4px}.notice{padding:12px 14px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;font-size:14px}.match{border-left:4px solid var(--ok);margin-bottom:14px}.score{font-size:30px;font-weight:900}.empty{text-align:center;padding:35px;border:1px dashed #cbd5e1;border-radius:14px;color:var(--muted);background:#fff}.modalBack{position:fixed;inset:0;background:#0f172a77;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{background:#fff;border-radius:18px;max-width:560px;width:100%;padding:24px}.close{float:right;border:0;background:#f2f4f7;border-radius:50%;width:32px;height:32px}.form{display:grid;gap:12px}.timeline{display:grid;gap:10px}.step{display:flex;gap:10px}.dot{width:12px;height:12px;border-radius:50%;background:#cbd5e1;margin-top:4px}.done{background:var(--ok)}footer{text-align:center;color:var(--muted);font-size:13px;margin-top:45px}@media(max-width:800px){.hero,.grid,.cards,.stats{grid-template-columns:1fr}.hero h1{font-size:40px}.links{display:none}}</style></head><body><nav class="nav"><div class="logo"><span>BC</span>BrickCircle</div><div class="links"><button onclick="go('home')">Home</button><button onclick="go('explore')">Explore</button><button onclick="go('dashboard')">Dashboard</button><button onclick="go('collection')">Collection</button><button onclick="go('wishlist')">Wishlist</button><button onclick="go('matches')">Matches</button></div><button class="primary" onclick="addSet()">+ Add set</button></nav><main id="app"></main><div id="modal"></div><script>const seed={user:{name:'Easwar',city:'Bengaluru',rating:4.9,trust:96,exchanges:7},owners:{u2:{name:'Alex',city:'Austin',rating:4.98,trust:99},u3:{name:'Maya',city:'London',rating:4.9,trust:97}},sets:[{id:'s1',num:'42143',name:'Ferrari Daytona SP3',theme:'Technic',value:450,emoji:'🏎️',condition:'Excellent',owner:'u1',available:true},{id:'s2',num:'42115',name:'Lamborghini Sián FKP 37',theme:'Technic',value:400,emoji:'🏎️',condition:'Excellent',owner:'u2',available:true},{id:'s3',num:'10318',name:'Concorde',theme:'Icons',value:220,emoji:'✈️',condition:'Excellent',owner:'u2',available:true},{id:'s4',num:'10307',name:'Eiffel Tower',theme:'Icons',value:630,emoji:'🗼',condition:'Very good',owner:'u3',available:true},{id:'s5',num:'75313',name:'AT-AT',theme:'Star Wars UCS',value:850,emoji:'🤖',condition:'Excellent',owner:'u3',available:true},{id:'s6',num:'10283',name:'NASA Space Shuttle Discovery',theme:'Icons',value:220,emoji:'🚀',condition:'Excellent',owner:'u2',available:true}],wishlist:['42115','10283'],exchanges:[]};let S=JSON.parse(localStorage.getItem('bc')||'null')||seed;const save=()=>localStorage.setItem('bc',JSON.stringify(S));const $=id=>document.getElementById(id);const money=n=>'$'+n.toLocaleString();function go(p){location.hash=p;render()}function owner(s){return s.owner==='u1'?S.user:S.owners[s.owner]}function card(s){let o=owner(s);return `<div class="card"><div class="setIcon">${s.emoji}</div><div class="top"><span class="pill">${s.theme}</span><span class="small muted">${s.num}</span></div><h3>${s.name}</h3><p class="muted small">${s.condition} · ${money(s.value)} · ${o.name} · ${o.city}</p><div class="actions"><button class="secondary" onclick="view('${s.id}')">View</button>${s.owner!=='u1'?`<button class="primary" onclick="request('${s.id}')">Request</button>`:''}</div></div>`}function home(){app.innerHTML=`<section class="hero"><div><span class="pill hot">GLOBAL COLLECTOR NETWORK · MVP</span><h1>Build.<br>Exchange.<br>Repeat.</h1><p>Temporarily exchange premium brick sets with verified collectors. Keep ownership, discover a new build, then swap again.</p><div class="cta"><button class="primary" onclick="go('explore')">Explore sets</button><button class="secondary" onclick="addSet()">List my collection</button></div></div><div class="card heroCard"><div class="small muted">PERFECT MATCH</div><div class="swap"><div class="mini"><div class="emoji">🏎️</div><b>Ferrari</b><div class="small muted">$450 · 42143</div></div><b>↔</b><div class="mini"><div class="emoji">🏎️</div><b>Lamborghini</b><div class="small muted">$400 · 42115</div></div></div><div class="notice" style="margin-top:14px">30-day exchange · Verified collectors · Security deposits</div></div></section><section class="section"><div class="head"><h2>How it works</h2></div><div class="grid"><div class="card"><span class="pill">01</span><h3>List</h3><p class="muted">Add the sets you own and mark availability.</p></div><div class="card"><span class="pill">02</span><h3>Match</h3><p class="muted">Tell us what you want. Reciprocal demand creates matches.</p></div><div class="card"><span class="pill">03</span><h3>Exchange</h3><p class="muted">Verify, deposit, ship, build, return and review.</p></div></div></section><section class="section"><div class="head"><h2>Live demo inventory</h2><button class="secondary" onclick="go('explore')">See all →</button></div><div class="cards">${S.sets.slice(0,3).map(card).join('')}</div></section><footer>BrickCircle MVP · Demo data is stored locally in your browser.</footer>`}function explore(){app.innerHTML=`<div class="head"><div><h2>Explore available sets</h2><p class="muted">Demo marketplace.</p></div></div><div class="toolbar"><input id="q" placeholder="Search Ferrari, Technic, Saturn..." oninput="filter()"><select id="t" onchange="filter()"><option value="">All themes</option><option>Technic</option><option>Icons</option><option>Star Wars UCS</option></select></div><div id="list" class="cards">${S.sets.filter(s=>s.owner!=='u1'&&s.available).map(card).join('')}</div>`}function filter(){let q=($('q').value||'').toLowerCase(),t=$('t').value;$('list').innerHTML=S.sets.filter(s=>s.owner!=='u1'&&s.available&&(!q||`${s.name} ${s.num} ${s.theme}`.toLowerCase().includes(q))&&(!t||s.theme===t)).map(card).join('')||'<div class="empty">No sets found.</div>'}function dashboard(){app.innerHTML=`<div class="head"><div><h2>Welcome back, ${S.user.name}</h2><p class="muted">Your collector control center.</p></div><button class="primary" onclick="addSet()">+ Add set</button></div><div class="stats"><div class="stat">Collection<b>${S.sets.filter(s=>s.owner==='u1').length}</b><span class="muted small">sets</span></div><div class="stat">Wishlist<b>${S.wishlist.length}</b><span class="muted small">wanted</span></div><div class="stat">Matches<b>${matches().length}</b><span class="muted small">potential</span></div><div class="stat">Trust<b>${S.user.trust}/100</b><span class="muted small">${S.user.rating} ★</span></div></div><section class="section"><div class="head"><h2>Best matches</h2></div>${matches().slice(0,2).map(matchCard).join('')||'<div class="empty">Add wishlist items to start matching.</div>'}</section>`}function collection(){app.innerHTML=`<div class="head"><div><h2>My collection</h2><p class="muted">Your sets and exchange availability.</p></div><button class="primary" onclick="addSet()">+ Add set</button></div><div class="cards">${S.sets.filter(s=>s.owner==='u1').map(card).join('')}</div>`}function wishlist(){app.innerHTML=`<div class="head"><div><h2>Wishlist</h2><p class="muted">Sets you'd like to build.</p></div><button class="primary" onclick="addWish()">+ Add wishlist set</button></div><div class="cards">${S.wishlist.map(n=>{let s=S.sets.find(x=>x.num===n);return `<div class="card"><div class="setIcon">${s?s.emoji:'🧱'}</div><span class="pill">${s?s.theme:'Wanted'}</span><h3>${s?s.name:'Set '+n}</h3><p class="muted">Set ${n}</p><div class="actions"><button class="secondary" onclick="removeWish('${n}')">Remove</button><button class="primary" onclick="go('matches')">Find matches</button></div></div>`}).join('')}</div>`}function matches(){let mine=S.sets.filter(s=>s.owner==='u1');return mine.flatMap(a=>S.sets.filter(b=>b.owner!=='u1'&&b.available&&S.wishlist.includes(b.num)).map(b=>({a,b,score:a.num==='42143'&&b.num==='42115'?96:75}))).sort((a,b)=>b.score-a.score)}function matchCard(m){return `<div class="card match"><div class="top"><div><span class="pill hot">${m.score}% MATCH</span><h3>${m.a.name} ↔ ${m.b.name}</h3><div class="muted small">You own ${m.a.num} · ${owner(m.b).name} owns ${m.b.num}</div></div><div class="score">${m.score}%</div></div><div class="notice" style="margin-top:12px">${m.score>=90?'🔥 Perfect reciprocal match.':'⭐ Strong match.'} 30-day exchange · Deposit protected</div><div class="actions"><button class="primary" onclick="request('${m.b.id}')">Send exchange request</button><button class="secondary" onclick="view('${m.b.id}')">View set</button></div></div>`}function request(id){let b=S.sets.find(x=>x.id===id),a=S.sets.find(x=>x.owner==='u1');modal(`<h2>Request exchange</h2><p>Exchange your <b>${a.name}</b> for <b>${b.name}</b>.</p><div class="notice">30 days · Security deposit ${money(Math.max(a.value,b.value))} each · Demo payment flow</div><div class="form" style="margin-top:14px"><select id="days"><option>30</option><option>60</option><option>90</option></select><label><input id="agree" type="checkbox"> I agree to the condition-photo checklist and return policy.</label><button class="primary" onclick="create('${id}')">Continue to deposit</button></div>`)}function create(id){if(!$('agree').checked)return alert('Please accept the exchange checklist.');let b=S.sets.find(x=>x.id===id),a=S.sets.find(x=>x.owner==='u1');S.exchanges.push({id:'EX'+Date.now(),a:a.id,b:b.id,days:+$('days').value,status:'active',deposit:Math.max(a.value,b.value)});save();close();go('exchange')}function exchange(){let x=S.exchanges.at(-1);if(!x)return app.innerHTML='<div class="empty">No active exchange yet. Find a match first.</div>';let a=S.sets.find(s=>s.id===x.a),b=S.sets.find(s=>s.id===x.b);app.innerHTML=`<div class="head"><div><h2>Exchange ${x.id}</h2><p class="muted">${a.name} ↔ ${b.name}</p></div><span class="pill ok">ACTIVE</span></div><div class="grid"><div class="card"><div class="setIcon">${a.emoji}</div><h3>Your ${a.name}</h3><p class="muted">${a.condition} · ${money(a.value)}</p></div><div class="card"><div class="setIcon">${b.emoji}</div><h3>Incoming ${b.name}</h3><p class="muted">${b.condition} · ${money(b.value)}</p></div><div class="card"><h3>Payment & deposit</h3><p>Authorized deposit: <b>${money(x.deposit)}</b></p><span class="pill ok">Demo payment authorized</span><p class="small muted">Production V2 will connect real marketplace payments.</p></div></div><section class="section card"><h3>Exchange timeline</h3><div class="timeline"><div class="step"><span class="dot done"></span> Exchange accepted</div><div class="step"><span class="dot done"></span> Deposit authorized</div><div class="step"><span class="dot"></span> Pre-exchange photos</div><div class="step"><span class="dot"></span> Sets shipped</div><div class="step"><span class="dot"></span> ${x.days}-day build period</div><div class="step"><span class="dot"></span> Return and inspection</div><div class="step"><span class="dot"></span> Deposit released</div></div><div class="actions"><button class="primary" onclick="complete()">Simulate return & complete</button></div></section>`}function complete(){S.exchanges.at(-1).status='completed';S.user.exchanges++;save();go('dashboard')}function view(id){let s=S.sets.find(x=>x.id===id),o=owner(s);modal(`<h2>${s.name}</h2><div class="setIcon">${s.emoji}</div><p><b>Set ${s.num}</b> · ${s.theme}</p><p>${s.condition} · Estimated value <b>${money(s.value)}</b></p><p>Collector: <b>${o.name}</b> · ${o.city} · ${o.rating} ★ · Trust ${o.trust}/100</p><div class="actions"><button class="secondary" onclick="close()">Close</button>${s.owner!=='u1'?`<button class="primary" onclick="close();request('${s.id}')">Request exchange</button>`:''}</div>`)}function addSet(){modal(`<h2>Add a set</h2><div class="form"><input id="n" placeholder="Set number e.g. 42143"><input id="name" placeholder="Set name"><input id="theme" placeholder="Theme e.g. Technic"><input id="value" type="number" placeholder="Estimated value USD"><select id="cond"><option>Excellent</option><option>Very good</option><option>Good</option></select><label><input id="avail" type="checkbox" checked> Available for exchange</label><button class="primary" onclick="saveSet()">Add to collection</button></div>`)}function saveSet(){if(!$('n').value||!$('name').value)return alert('Set number and name are required.');S.sets.push({id:'s'+Date.now(),num:$('n').value,name:$('name').value,theme:$('theme').value||'Other',value:+$('value').value||0,emoji:'🧱',condition:$('cond').value,owner:'u1',available:$('avail').checked});save();close();go('collection')}function addWish(){modal(`<h2>Add wishlist set</h2><div class="form"><input id="wn" placeholder="Set number e.g. 42115"><button class="primary" onclick="saveWish()">Add to wishlist</button></div>`)}function saveWish(){let n=$('wn').value.trim();if(n&&!S.wishlist.includes(n))S.wishlist.push(n);save();close();go('wishlist')}function removeWish(n){S.wishlist=S.wishlist.filter(x=>x!==n);save();go('wishlist')}function modal(h){$('modal').innerHTML=`<div class="modalBack" onclick="if(event.target===this)close()"><div class="modal"><button class="close" onclick="close()">×</button>${h}</div></div>`}function close(){$('modal').innerHTML=''}function render(){let p=location.hash.slice(1)||'home';({home,explore,dashboard,collection,wishlist,matches:()=>app.innerHTML='<div class="head"><h2>Your matches</h2></div>'+matches().map(matchCard).join(''),exchange} [p]||home)()}render();</script></body></html>
