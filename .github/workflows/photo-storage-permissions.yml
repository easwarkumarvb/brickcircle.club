name: Isolated photo storage permissions
on:
  workflow_dispatch:
  push:
    branches: ['dev/photo-storage-permission-qa', 'qa/hosted-photo-review']
  pull_request:
    paths:
      - 'qa/photo-storage/**'
      - 'supabase/migrations/*collection_gallery*'
      - 'app-v3.js'
      - 'tests/static/owner-photo-signed-url-runtime.test.mjs'
      - 'tests/static/owner-photo-gallery-runtime.test.mjs'
      - 'supabase/migrations/*owner_photo*'
      - 'supabase/migrations/*bind_collection_photo_reads*'
      - 'supabase/migrations/*participant_collection_photo_access*'
      - 'supabase/migrations/*rls_hardening*'
      - 'supabase/migrations/*canonical_exchange_state_machine*'
      - 'supabase/migrations/*canonical_participant_collection_photo_access*'
      - '.github/workflows/photo-storage-permissions.yml'
permissions:
  contents: read
jobs:
  permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: brickcircle
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: photo_storage_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U brickcircle -d photo_storage_qa"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      DSN: postgresql://brickcircle:disposable-ci-only@127.0.0.1:5432/photo_storage_qa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Actual signed photo URL cache and account isolation contracts
        run: node --test tests/static/owner-photo-signed-url-runtime.test.mjs tests/static/owner-photo-gallery-runtime.test.mjs
      - name: Actual current collection and Storage policy migrations
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f qa/photo-storage/base.sql
      - name: Owner writes, match and legacy participant reads, outsider and anonymous denial
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f qa/photo-storage/permissions.sql
      - name: Strictly reproduce the pre-fix canonical photo gap
        run: |
          set -o pipefail
          psql "$DSN" -v ON_ERROR_STOP=1 -v expect_missing=true -f qa/photo-storage/canonical-participant.sql | tee photo-permission-before.txt
      - name: Apply SELECT-only participant repair twice to check idempotency
        run: |
          psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/20261013044724_canonical_participant_collection_photo_access.sql
          psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/20261013044724_canonical_participant_collection_photo_access.sql
      - name: Existing owner writes and privacy remain intact after repair
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f qa/photo-storage/permissions.sql
      - name: Repaired canonical proposal, acceptance and archive permissions
        run: |
          set -o pipefail
          psql "$DSN" -v ON_ERROR_STOP=1 -f qa/photo-storage/canonical-participant.sql | tee photo-permission-after.txt
      - name: Strictly reproduce forged collection photo reference exposure
        run: |
          set -o pipefail
          psql "$DSN" -v ON_ERROR_STOP=1 -v expect_exposure=true -f qa/photo-storage/forged-reference.sql | tee photo-reference-before.txt
      - name: Apply Storage owner binding twice to check idempotency
        run: |
          psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/20261013080000_bind_collection_photo_reads_to_owner.sql
          psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/20261013080000_bind_collection_photo_reads_to_owner.sql
      - name: Legitimate reads and owner-only writes survive owner binding
        run: |
          psql "$DSN" -v ON_ERROR_STOP=1 -f qa/photo-storage/permissions.sql
          psql "$DSN" -v ON_ERROR_STOP=1 -f qa/photo-storage/canonical-participant.sql
      - name: Forged references cannot authorize another owner's photograph
        run: |
          set -o pipefail
          psql "$DSN" -v ON_ERROR_STOP=1 -f qa/photo-storage/forged-reference.sql | tee photo-reference-after.txt
      - name: Owner orphan cleanup denied before the gallery owner-self read branch
        run: |
          set -o pipefail
          psql "$DSN" -v ON_ERROR_STOP=1 -v expect_denied=true -f qa/photo-storage/orphan-cleanup.sql | tee photo-orphan-before.txt
      - name: Apply supplemental gallery policy twice without widening collection access
        run: |
          psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/20261014090000_collection_gallery_owner_binding.sql
          psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/20261014090000_collection_gallery_owner_binding.sql
      - name: Owner orphan cleanup allowed for the owner's own folder only after the gallery read branch
        run: |
          set -o pipefail
          psql "$DSN" -v ON_ERROR_STOP=1 -f qa/photo-storage/orphan-cleanup.sql | tee photo-orphan-after.txt
      - name: Gallery owner, reciprocal match, canonical archive and privacy evidence
        run: |
          set -o pipefail
          psql "$DSN" -v ON_ERROR_STOP=1 -f qa/photo-storage/gallery.sql | tee photo-gallery.txt
          psql "$DSN" -v ON_ERROR_STOP=1 -f qa/photo-storage/permissions.sql
          psql "$DSN" -v ON_ERROR_STOP=1 -f qa/photo-storage/canonical-participant.sql
          psql "$DSN" -v ON_ERROR_STOP=1 -f qa/photo-storage/forged-reference.sql
      - name: Retain synthetic permission evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: photo-storage-permission-evidence
          path: |
            photo-permission-before.txt
            photo-permission-after.txt
            photo-reference-before.txt
            photo-reference-after.txt
            photo-orphan-before.txt
            photo-orphan-after.txt
            photo-gallery.txt
          if-no-files-found: ignore
          retention-days: 14
