name: UX quality gates
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - name: Isolated responsive, accessibility and reusable journey gates
        run: npm run test:ux
      - name: Transport and evidence guards
        if: ${{ !cancelled() }}
        run: npm run test:ux:guards
      - name: Build synthetic screenshot gallery
        if: ${{ always() && !cancelled() }}
        run: node scripts/ux-gallery.mjs
      - name: Generate redacted actionable triage
        if: ${{ always() && !cancelled() }}
        env:
          BC_UX_REQUIRE_BROWSER_REPORT: '1'
        run: node scripts/ux-triage.mjs
      - name: Publish triage summary
        if: ${{ always() && !cancelled() }}
        run: cat ux-report/triage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain isolated evidence on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-ux-evidence
          path: ux-report/
          retention-days: 14
          if-no-files-found: warn
