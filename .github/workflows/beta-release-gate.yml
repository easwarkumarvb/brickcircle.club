name: BrickCircle Beta Release Gate
on:
  pull_request:

jobs:
  owner-photo-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Syntax-check owner photo client
        run: node --check collection-owner-photo.js
      - name: Verify mandatory photo, privacy and legacy guards
        run: node qa/owner_photo_static_test.mjs

  web-push-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: brickcircle
          POSTGRES_PASSWORD: brickcircle
          POSTGRES_DB: brickcircle_push
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U brickcircle -d brickcircle_push"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      DSN: postgresql://brickcircle:brickcircle@127.0.0.1:5432/brickcircle_push
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.5.2 }
      - name: Type-check Web Push Edge Function
        run: deno check --config supabase/functions/send-web-push/deno.json supabase/functions/send-web-push/index.ts
      - name: Load isolated Web Push schema
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f qa/web_push_base.sql
      - name: Apply Web Push migration
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/20260907084632_web_push_notifications.sql
      - name: Verify RLS, reciprocal events and deduplication
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/tests/web_push_notifications.sql

  exchange-proposal-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: brickcircle
          POSTGRES_PASSWORD: brickcircle
          POSTGRES_DB: brickcircle_notifications
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U brickcircle -d brickcircle_notifications"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      DSN: postgresql://brickcircle:brickcircle@127.0.0.1:5432/brickcircle_notifications
    steps:
      - uses: actions/checkout@v4
      - name: Load isolated exchange notification schema
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f qa/exchange_notification_base.sql
      - name: Apply exchange proposal notification migration
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/20260907062008_exchange_proposal_notifications.sql
      - name: Verify durability, recipient security, deep links and deduplication
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/tests/exchange_proposal_notifications.sql

  reciprocal-alias-matching:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: brickcircle
          POSTGRES_PASSWORD: brickcircle
          POSTGRES_DB: brickcircle_matching
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U brickcircle -d brickcircle_matching"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      DSN: postgresql://brickcircle:brickcircle@127.0.0.1:5432/brickcircle_matching
    steps:
      - uses: actions/checkout@v4
      - name: Load isolated matching schema
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f qa/matching_alias_base.sql
      - name: Apply reciprocal alias migration
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/20260906084526_reciprocal_lego_product_alias_matching.sql
      - name: Verify exact, alias, locality and availability behavior
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/tests/reciprocal_set_alias_matching.sql

  collection-removal-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: brickcircle
          POSTGRES_PASSWORD: brickcircle
          POSTGRES_DB: brickcircle_collection
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U brickcircle -d brickcircle_collection"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      DSN: postgresql://brickcircle:brickcircle@127.0.0.1:5432/brickcircle_collection
    steps:
      - uses: actions/checkout@v4
      - name: Load isolated collection lifecycle schema
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f qa/collection_removal_base.sql
      - name: Apply collection-removal migrations
        run: |
          psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/20260908123500_safe_collection_item_removal.sql
          psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/20260908235500_release_cancelled_exchange_items.sql
          psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/20260909001000_fix_cancel_before_handoff_owner_photo_trigger.sql
      - name: Verify cancellation, snapshots, active-reference guards and RLS
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/tests/cancelled_exchange_collection_removal.sql

  exchange-availability-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: brickcircle
          POSTGRES_PASSWORD: brickcircle
          POSTGRES_DB: brickcircle_exchange_integrity
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U brickcircle -d brickcircle_exchange_integrity"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      DSN: postgresql://brickcircle:brickcircle@127.0.0.1:5432/brickcircle_exchange_integrity
    steps:
      - uses: actions/checkout@v4
      - name: Load isolated exchange availability schema
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f qa/exchange_availability_base.sql
      - name: Apply exchange availability integrity migration
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/20260910052000_exchange_availability_integrity.sql
      - name: Verify repair, matching, reservation and grant invariants
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/tests/exchange_availability_integrity.sql

  browser-rpc-privilege-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: brickcircle
          POSTGRES_PASSWORD: brickcircle
          POSTGRES_DB: brickcircle_security
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U brickcircle -d brickcircle_security"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      DSN: postgresql://brickcircle:brickcircle@127.0.0.1:5432/brickcircle_security
    steps:
      - uses: actions/checkout@v4
      - name: Load isolated browser privilege schema
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f qa/browser_rpc_privilege_base.sql
      - name: Apply browser RPC privilege migration
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/20260910084500_browser_rpc_privilege_hardening.sql
      - name: Verify anonymous, authenticated, trigger and service boundaries
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/tests/browser_rpc_privilege_hardening.sql

  dependency-audit:
    if: startsWith(github.head_ref, 'qa-beta-release-gate')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - name: Runtime dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency audit report
        if: always()
        run: npm audit --audit-level=high || true

  founding-100-concurrency:
    if: startsWith(github.head_ref, 'qa-beta-release-gate')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: brickcircle
          POSTGRES_PASSWORD: brickcircle
          POSTGRES_DB: brickcircle_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U brickcircle -d brickcircle_qa"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      DSN: postgresql://brickcircle:brickcircle@127.0.0.1:5432/brickcircle_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Load minimal production prerequisites
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f qa/membership_base.sql
      - name: Apply the actual production membership migration
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/20260829_membership_program_v31.sql
      - name: Simulate the first 100 simultaneous registrations
        run: python qa/membership_100_concurrency.py

  marketplace-100-load:
    if: startsWith(github.head_ref, 'qa-beta-release-gate')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: brickcircle
          POSTGRES_PASSWORD: brickcircle
          POSTGRES_DB: brickcircle_loadtest
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U brickcircle -d brickcircle_loadtest"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      DSN: postgresql://brickcircle:brickcircle@127.0.0.1:5432/brickcircle_loadtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -r loadtest/requirements.txt
      - name: Initialize isolated marketplace schema
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f loadtest/schema.sql
      - name: Generate 100-member marketplace
        run: python loadtest/generate.py --users 100 --sets 500 --collection-per-user 10 --wishlist-per-user 10 --dsn "$DSN"
      - name: Benchmark reciprocal matching under concurrent demand
        run: python loadtest/benchmark.py --users 100 --concurrency 20 --requests 100 --dsn "$DSN"
