name: Hosted Supabase Exchange Smoke

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open BrickCircle pull request number to test
        required: true
        type: string
      expected_head_sha:
        description: Exact 40-character pull request head SHA approved for staging
        required: true
        type: string
      confirmation:
        description: Type RUN_ISOLATED_BRICKCIRCLE_STAGING_SMOKE
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: hosted-supabase-exchange-smoke
  cancel-in-progress: false

jobs:
  validate-pr:
    name: validate requested pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      head_sha: ${{ steps.validate.outputs.head_sha }}
    steps:
      - name: Validate pull request and immutable head
        id: validate
        uses: actions/github-script@v7
        env:
          REQUESTED_PR: ${{ inputs.pull_request_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            const prText = process.env.REQUESTED_PR || '';
            const expectedSha = process.env.EXPECTED_HEAD_SHA || '';
            const confirmation = process.env.CONFIRMATION || '';

            if (!/^[1-9][0-9]*$/.test(prText)) {
              core.setFailed('pull_request_number must be a positive integer');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(expectedSha)) {
              core.setFailed('expected_head_sha must be a full lowercase commit SHA');
              return;
            }
            if (confirmation !== 'RUN_ISOLATED_BRICKCIRCLE_STAGING_SMOKE') {
              core.setFailed('Explicit staging-smoke confirmation is required');
              return;
            }

            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: Number(prText),
            });

            if (pr.state !== 'open') {
              core.setFailed('The selected pull request must be open');
              return;
            }
            if (pr.head.repo?.full_name !== `${owner}/${repo}`) {
              core.setFailed('Fork pull requests cannot use the protected staging environment');
              return;
            }
            if (pr.head.ref !== 'codex/canonical-exchange-state-machine') {
              core.setFailed('The selected pull request is not the canonical exchange branch');
              return;
            }
            if (pr.head.sha !== expectedSha) {
              core.setFailed('The selected pull request head does not match expected_head_sha');
              return;
            }

            core.setOutput('head_sha', expectedSha);

  hosted-exchange-smoke:
    name: guarded canonical exchange staging smoke
    needs: validate-pr
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: hosted-supabase-staging
    env:
      BC_HOSTED_SMOKE_CONFIRMATION: ${{ inputs.confirmation }}
      BC_HOSTED_SMOKE_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
      BC_HOSTED_SMOKE_EXPECTED_HEAD_SHA: ${{ needs.validate-pr.outputs.head_sha }}
      BC_STAGING_SUPABASE_URL: ${{ secrets.BC_STAGING_SUPABASE_URL }}
      BC_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.BC_STAGING_SUPABASE_PUBLISHABLE_KEY }}
      BC_STAGING_SUPABASE_SECRET_KEY: ${{ secrets.BC_STAGING_SUPABASE_SECRET_KEY }}
      BC_STAGING_NOTIFICATION_MODE: ${{ vars.BC_STAGING_NOTIFICATION_MODE }}
      BC_STAGING_SUPABASE_PROJECT_REF: ${{ vars.BC_STAGING_SUPABASE_PROJECT_REF }}
      BC_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.BC_PRODUCTION_SUPABASE_PROJECT_REF }}
      BC_STAGING_ALLOWED_EMAIL_DOMAIN: ${{ vars.BC_STAGING_ALLOWED_EMAIL_DOMAIN }}
      BC_STAGING_APPROVED_SINK_DOMAIN: ${{ vars.BC_STAGING_APPROVED_SINK_DOMAIN }}
      BC_STAGING_USER_A_EMAIL: ${{ secrets.BC_STAGING_USER_A_EMAIL }}
      BC_STAGING_USER_A_PASSWORD: ${{ secrets.BC_STAGING_USER_A_PASSWORD }}
      BC_STAGING_USER_B_EMAIL: ${{ secrets.BC_STAGING_USER_B_EMAIL }}
      BC_STAGING_USER_B_PASSWORD: ${{ secrets.BC_STAGING_USER_B_PASSWORD }}
      BC_STAGING_USER_C_EMAIL: ${{ secrets.BC_STAGING_USER_C_EMAIL }}
      BC_STAGING_USER_C_PASSWORD: ${{ secrets.BC_STAGING_USER_C_PASSWORD }}
      BC_STAGING_SET_A: ${{ vars.BC_STAGING_SET_A }}
      BC_STAGING_SET_B: ${{ vars.BC_STAGING_SET_B }}
      BC_HOSTED_SMOKE_REPORT: artifacts/hosted-exchange-smoke.json
    steps:
      - name: Check out the validated pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-pr.outputs.head_sha }}
          persist-credentials: false
      - name: Confirm immutable checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ needs.validate-pr.outputs.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify staging safety guards
        run: npm run test:hosted:guard
      - name: Run hosted canonical exchange smoke
        run: npm run smoke:hosted:exchange
      - name: Upload redacted staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-exchange-smoke-${{ needs.validate-pr.outputs.head_sha }}
          path: artifacts/hosted-exchange-smoke.json
          if-no-files-found: warn
          retention-days: 30
