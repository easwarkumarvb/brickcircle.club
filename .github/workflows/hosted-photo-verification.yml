name: Hosted photo verification
on:
  workflow_dispatch:
    inputs:
      expected_candidate_sha:
        description: Fixed merged candidate d05a26a2cbdd97a5be489ca076fd8c9a8d38d2ad
        required: true
        type: string
      confirmation:
        description: Type RUN_ISOLATED_BRICKCIRCLE_STAGING_SMOKE
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: hosted-supabase-exchange-smoke
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/hosted/hosted-photo.test.mjs
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          EXPECTED_SHA: ${{ inputs.expected_candidate_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            const {validateSelection}=await import(`${process.env.GITHUB_WORKSPACE}/scripts/validate-hosted-photo.mjs`);
            const prs=await Promise.all([143,144].map(async pull_number=>(await github.rest.pulls.get({...context.repo,pull_number})).data));
            validateSelection({repository:`${context.repo.owner}/${context.repo.repo}`,ref:context.ref,eventName:context.eventName,
              sha:process.env.EXPECTED_SHA,confirmation:process.env.CONFIRMATION,prs});
  staging:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: hosted-supabase-staging
    env:
      BC_HOSTED_SMOKE_CONFIRMATION: ${{ inputs.confirmation }}
      BC_HOSTED_SMOKE_EXPECTED_HEAD_SHA: ${{ inputs.expected_candidate_sha }}
      BC_STAGING_SUPABASE_PROJECT_REF: ${{ vars.BC_STAGING_SUPABASE_PROJECT_REF }}
      BC_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.BC_PRODUCTION_SUPABASE_PROJECT_REF }}
      BC_STAGING_ALLOWED_EMAIL_DOMAIN: ${{ vars.BC_STAGING_ALLOWED_EMAIL_DOMAIN }}
      BC_STAGING_NOTIFICATION_MODE: ${{ vars.BC_STAGING_NOTIFICATION_MODE }}
      BC_STAGING_SET_A: ${{ vars.BC_STAGING_SET_A }}
      BC_STAGING_SET_B: ${{ vars.BC_STAGING_SET_B }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Revalidate fixed merged provenance after environment review
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          EXPECTED_SHA: ${{ inputs.expected_candidate_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            const {validateSelection}=await import(`${process.env.GITHUB_WORKSPACE}/scripts/validate-hosted-photo.mjs`);
            const prs=await Promise.all([143,144].map(async pull_number=>(await github.rest.pulls.get({...context.repo,pull_number})).data));
            validateSelection({repository:`${context.repo.owner}/${context.repo.repo}`,ref:context.ref,eventName:context.eventName,
              sha:process.env.EXPECTED_SHA,confirmation:process.env.CONFIRMATION,prs});
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: d05a26a2cbdd97a5be489ca076fd8c9a8d38d2ad
          path: candidate
          persist-credentials: false
      - run: test "$(git -C candidate rev-parse HEAD)" = "$BC_HOSTED_SMOKE_EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Offline transport and provenance tests
        run: node --test tests/hosted/hosted-photo.test.mjs
      - name: Actual immutable candidate signed URL cache tests
        working-directory: candidate
        run: node --test tests/static/owner-photo-signed-url-runtime.test.mjs
      - name: Validate target before privileged fixture provisioning
        env:
          BC_STAGING_SUPABASE_URL: ${{ secrets.BC_STAGING_SUPABASE_URL }}
          BC_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.BC_STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: node --input-type=module -e "import {validateTarget} from './scripts/validate-hosted-photo.mjs'; try{validateTarget(process.env)}catch{console.error('Photo staging target rejected; values withheld');process.exitCode=1}"
      - name: Provision three fresh synthetic accounts with guarded trusted helper
        id: users
        env:
          BC_STAGING_SUPABASE_URL: ${{ secrets.BC_STAGING_SUPABASE_URL }}
          BC_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.BC_STAGING_SUPABASE_PUBLISHABLE_KEY }}
          BC_STAGING_SUPABASE_SECRET_KEY: ${{ secrets.BC_STAGING_SUPABASE_SECRET_KEY }}
        run: node scripts/hosted-photo-privileged.mjs bootstrap
      - name: Public-key Storage HTTP functional preflight and verification
        env:
          BC_STAGING_SUPABASE_URL: ${{ secrets.BC_STAGING_SUPABASE_URL }}
          BC_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.BC_STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/hosted-photo-http.mjs
      - name: Retained fixture outbox audit without provider delivery
        if: ${{ !cancelled() && steps.users.outcome == 'success' }}
        env:
          BC_STAGING_SUPABASE_URL: ${{ secrets.BC_STAGING_SUPABASE_URL }}
          BC_STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.BC_STAGING_SUPABASE_PUBLISHABLE_KEY }}
          BC_STAGING_SUPABASE_SECRET_KEY: ${{ secrets.BC_STAGING_SUPABASE_SECRET_KEY }}
        run: node scripts/hosted-photo-privileged.mjs audit
      - name: Only fixed redacted evidence artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-photo-d05a26a
          path: |
            artifacts/hosted-photo-http.json
            artifacts/hosted-photo-outbox.json
          retention-days: 30
          if-no-files-found: warn
