name: Hosted photo runner guards
on:
  pull_request:
    paths: ['.github/workflows/hosted-photo-*.yml', 'scripts/*hosted-photo*.mjs', 'tests/hosted/hosted-photo.test.mjs', 'vercel.json', '.github/workflows/hosted-supabase-beta-release.yml', 'scripts/validate-hosted-beta-release.mjs', 'tests/hosted/hosted-beta-release.test.mjs']
  push:
    branches: [main, qa/hosted-photo-verification]
    paths: ['.github/workflows/hosted-photo-*.yml', 'scripts/*hosted-photo*.mjs', 'tests/hosted/hosted-photo.test.mjs', 'vercel.json', '.github/workflows/hosted-supabase-beta-release.yml', 'scripts/validate-hosted-beta-release.mjs', 'tests/hosted/hosted-beta-release.test.mjs']
permissions:
  contents: read
jobs:
  offline-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/hosted/hosted-photo.test.mjs tests/hosted/hosted-beta-release.test.mjs tests/static/owner-photo-signed-url-runtime.test.mjs
