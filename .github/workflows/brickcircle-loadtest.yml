name: BrickCircle 100K Load Test

on:
  workflow_dispatch:
    inputs:
      users:
        description: Synthetic users
        required: true
        default: '100000'
      sets:
        description: LEGO sets
        required: true
        default: '10000'
      collection_per_user:
        description: Collection items per user
        required: true
        default: '50'
      wishlist_per_user:
        description: Wishlist items per user
        required: true
        default: '50'
      concurrency:
        description: Concurrent benchmark workers
        required: true
        default: '100'
      requests:
        description: Match requests
        required: true
        default: '1000'

jobs:
  loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: brickcircle
          POSTGRES_PASSWORD: brickcircle
          POSTGRES_DB: brickcircle_loadtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U brickcircle -d brickcircle_loadtest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: brickcircle
      PGPASSWORD: brickcircle
      PGDATABASE: brickcircle_loadtest
      DSN: postgresql://brickcircle:brickcircle@127.0.0.1:5432/brickcircle_loadtest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install -r loadtest/requirements.txt

      - name: Wait for PostgreSQL
        run: |
          set -euo pipefail
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U brickcircle -d brickcircle_loadtest && exit 0
            sleep 2
          done
          exit 1

      - name: Initialize load-test schema
        run: |
          set -euo pipefail
          psql "$DSN" -v ON_ERROR_STOP=1 -f loadtest/schema.sql

      - name: Generate synthetic dataset
        run: |
          set -euo pipefail
          python loadtest/generate.py \
            --users "${{ inputs.users }}" \
            --sets "${{ inputs.sets }}" \
            --collection-per-user "${{ inputs.collection_per_user }}" \
            --wishlist-per-user "${{ inputs.wishlist_per_user }}" \
            --dsn "$DSN" 2>&1 | tee loadtest-generation.log

      - name: Verify dataset counts
        run: |
          set -euo pipefail
          expected_users=${{ inputs.users }}
          expected_sets=${{ inputs.sets }}
          expected_collection=$(( ${{ inputs.users }} * ${{ inputs.collection_per_user }} ))
          expected_wishlist=$(( ${{ inputs.users }} * ${{ inputs.wishlist_per_user }} ))
          actual_users=$(psql "$DSN" -Atc 'select count(*) from profiles')
          actual_sets=$(psql "$DSN" -Atc 'select count(*) from lego_sets')
          actual_collection=$(psql "$DSN" -Atc 'select count(*) from collection_items')
          actual_wishlist=$(psql "$DSN" -Atc 'select count(*) from wishlists')
          printf 'profiles=%s/%s\nsets=%s/%s\ncollection_items=%s/%s\nwishlists=%s/%s\n' \
            "$actual_users" "$expected_users" "$actual_sets" "$expected_sets" \
            "$actual_collection" "$expected_collection" "$actual_wishlist" "$expected_wishlist" | tee dataset-counts.txt
          test "$actual_users" -eq "$expected_users"
          test "$actual_sets" -eq "$expected_sets"
          test "$actual_collection" -eq "$expected_collection"
          test "$actual_wishlist" -eq "$expected_wishlist"

      - name: Analyze database
        run: |
          set -euo pipefail
          psql "$DSN" -v ON_ERROR_STOP=1 -c 'ANALYZE;'
          psql "$DSN" -v ON_ERROR_STOP=1 -c "select relname, pg_size_pretty(pg_total_relation_size(relid)) total_size from pg_catalog.pg_statio_user_tables order by pg_total_relation_size(relid) desc;" | tee database-sizes.txt

      - name: Run reciprocal-match benchmark
        run: |
          set -euo pipefail
          python loadtest/benchmark.py \
            --users "${{ inputs.users }}" \
            --concurrency "${{ inputs.concurrency }}" \
            --requests "${{ inputs.requests }}" \
            --dsn "$DSN" 2>&1 | tee benchmark-results.txt

      - name: Capture index statistics
        if: always()
        run: |
          psql "$DSN" -c "select schemaname, relname, indexrelname, idx_scan, idx_tup_read, idx_tup_fetch from pg_stat_user_indexes order by idx_scan desc;" > index-stats.txt || true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brickcircle-loadtest-results-${{ github.run_number }}
          path: |
            benchmark-results.txt
            loadtest-generation.log
            dataset-counts.txt
            database-sizes.txt
            index-stats.txt
          retention-days: 30
