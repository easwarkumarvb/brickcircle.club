name: BrickCircle 100K Load Test

on:
  workflow_dispatch:
    inputs:
      users:
        description: Synthetic users
        required: true
        default: '100000'
      sets:
        description: LEGO sets
        required: true
        default: '10000'
      collection_per_user:
        description: Collection items per user
        required: true
        default: '50'
      wishlist_per_user:
        description: Wishlist items per user
        required: true
        default: '50'
      concurrency:
        description: Concurrent benchmark workers
        required: true
        default: '100'
      requests:
        description: Match requests
        required: true
        default: '1000'

jobs:
  loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: brickcircle
          POSTGRES_PASSWORD: brickcircle
          POSTGRES_DB: brickcircle_loadtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U brickcircle -d brickcircle_loadtest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: brickcircle
      PGPASSWORD: brickcircle
      PGDATABASE: brickcircle_loadtest
      DSN: postgresql://brickcircle:brickcircle@127.0.0.1:5432/brickcircle_loadtest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Python dependencies
        run: python -m pip install -r loadtest/requirements.txt

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U brickcircle -d brickcircle_loadtest && exit 0
            sleep 2
          done
          exit 1

      - name: Initialize load-test schema
        run: psql "$DSN" -v ON_ERROR_STOP=1 -f loadtest/schema.sql

      - name: Generate synthetic dataset
        run: |
          python loadtest/generate.py \
            --users "${{ inputs.users }}" \
            --sets "${{ inputs.sets }}" \
            --collection-per-user "${{ inputs.collection_per_user }}" \
            --wishlist-per-user "${{ inputs.wishlist_per_user }}" \
            --dsn "$DSN" 2>&1 | tee loadtest-generation.log

      - name: Analyze database
        run: |
          psql "$DSN" -c 'ANALYZE;'
          psql "$DSN" -c "select relname, pg_size_pretty(pg_total_relation_size(relid)) total_size from pg_catalog.pg_statio_user_tables order by pg_total_relation_size(relid) desc;" | tee database-sizes.txt

      - name: Run reciprocal-match benchmark
        run: |
          python loadtest/benchmark.py \
            --users "${{ inputs.users }}" \
            --concurrency "${{ inputs.concurrency }}" \
            --requests "${{ inputs.requests }}" \
            --dsn "$DSN" 2>&1 | tee benchmark-results.txt

      - name: Capture index statistics
        if: always()
        run: |
          psql "$DSN" -c "select schemaname, relname, indexrelname, idx_scan, idx_tup_read, idx_tup_fetch from pg_stat_user_indexes order by idx_scan desc;" > index-stats.txt || true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brickcircle-loadtest-results-${{ github.run_number }}
          path: |
            benchmark-results.txt
            loadtest-generation.log
            database-sizes.txt
            index-stats.txt
          retention-days: 30
