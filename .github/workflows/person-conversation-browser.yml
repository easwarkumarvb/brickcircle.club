name: Person conversation browser acceptance
on:
  pull_request:
    paths:
      - 'app-v3.js'
      - 'collector-ux.css'
      - 'tests/isolated/**'
      - '.github/workflows/person-conversation-browser.yml'
permissions:
  contents: read
jobs:
  conversation-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install browser and dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Bundle Chromium for branch-local debugging
        if: always() && matrix.browser == 'chromium' && github.head_ref == 'dev/person-first-conversations'
        run: |
          python - <<'PY'
          import os, pathlib, tarfile
          cache = pathlib.Path.home() / '.cache' / 'ms-playwright'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'conversation-chromium-runtime.tar.gz'
          entries = list(cache.glob('chromium_headless_shell-*')) + list(cache.glob('ffmpeg-*'))
          if not entries:
              raise SystemExit('No installed Chromium shell')
          with tarfile.open(target, 'w:gz') as archive:
              for entry in entries:
                  archive.add(entry, arcname=entry.name)
          PY
      - name: Retain public browser runtime for local test fallback
        if: always() && matrix.browser == 'chromium' && github.head_ref == 'dev/person-first-conversations'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conversation-chromium-runtime
          path: ${{ runner.temp }}/conversation-chromium-runtime.tar.gz
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
      - name: Person conversation and canonical mobile journeys
        run: npm run test:isolated -- tests/isolated/guided-exchange-messaging.spec.ts tests/isolated/person-conversation-read-model.spec.ts tests/isolated/messaging-polish.spec.ts tests/isolated/mobile-core-journeys.spec.ts tests/isolated/canonical-exchange-review-fixes.spec.ts tests/isolated/beta-reliability-three-user.spec.ts --project=${{ matrix.browser }} --retries=0
      - name: Retain isolated conversation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: person-conversation-${{ matrix.browser }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
