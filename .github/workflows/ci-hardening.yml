name: BrickCircle CI
on:
  pull_request:
  push:
    branches: [hardening-v1]
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run syntax-check
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Chromium regression + functional UI suite
        run: npm run test:e2e
        env:
          BC_BASE_URL: https://www.brickcircle.club
      - name: Firefox + WebKit cross-browser, visual and accessibility suite
        run: npm run test:cross-browser
        env:
          BC_BASE_URL: https://www.brickcircle.club
