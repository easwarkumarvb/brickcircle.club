name: BrickCircle CI
on:
  pull_request:
  push:
    branches: [hardening-v1]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run syntax-check
      - run: npx playwright install --with-deps chromium
      - name: Start local V3 site
        run: |
          python3 -m http.server 4173 > /tmp/brickcircle-http.log 2>&1 &
          sleep 1
      - run: npm run test:e2e
        env:
          BC_BASE_URL: http://127.0.0.1:4173
