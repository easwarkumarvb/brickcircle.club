name: BrickCircle CI
on:
  pull_request:
  push:
    branches: [hardening-v1]
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run syntax-check
      - name: Install Chromium for regression suite
        run: npx playwright install --with-deps chromium
      - name: Chromium regression + functional UI suite against production
        run: npm run test:e2e
        env:
          BC_BASE_URL: https://www.brickcircle.club
      - name: Reclaim browser/test disk before cross-browser gate
        run: |
          rm -rf ~/.cache/ms-playwright/chromium-* ~/.cache/ms-playwright/chromium_headless_shell-* test-results playwright-report
          df -h /
      - name: Install Firefox + WebKit
        run: npx playwright install --with-deps firefox webkit
      - name: Start branch-local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/brickcircle-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/brickcircle-http.log
          exit 1
      - name: Firefox + WebKit cross-browser, visual and accessibility suite
        run: npm run test:cross-browser
        env:
          BC_BASE_URL: http://127.0.0.1:4173
