name: BrickCircle CI
on:
  pull_request:
  push:
    branches: [main, hardening-v1]
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git diff check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run release:check
      - run: npm run typecheck
      - run: npm run syntax-check
      - name: Beta security contract suite
        run: npm run test:security-contracts
      - name: Owner review recovery contract
        run: npm run test:owner-review-recovery
      - name: Collector avatar pipeline contract
        run: npm run test:collector-avatar
      - name: Hosted smoke harness regression suite
        run: npm run test:hosted:guard
      - name: Non-destructive release and workflow regression suite
        run: npm run test:static
      - name: Install Chromium for regression suite
        run: npx playwright install --with-deps chromium
      - name: Chromium isolated functional suite
        run: npm run test:isolated:chromium
      - name: Upload Chromium admin screenshots
        uses: actions/upload-artifact@v4
        with:
          name: admin-console-chromium
          path: test-results/**/admin-*.png
          if-no-files-found: ignore
      - name: Reclaim test artifacts before cross-browser gate
        run: |
          rm -rf test-results playwright-report
          df -h /
      - name: Install Firefox + WebKit
        run: npx playwright install --with-deps firefox webkit
      - name: WebKit uncertain-delivery regression
        run: npm run test:isolated -- tests/isolated/canonical-exchange-review-fixes.spec.ts --project=webkit --grep "committed response is lost" --retries=0 --repeat-each=3
      - name: Firefox + WebKit isolated functional suite
        run: npm run test:isolated -- --project=firefox --project=webkit
      - name: Upload Firefox and WebKit admin screenshots
        uses: actions/upload-artifact@v4
        with:
          name: admin-console-firefox-webkit
          path: test-results/**/admin-*.png
          if-no-files-found: ignore
      - name: Start branch-local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/brickcircle-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/brickcircle-http.log
          exit 1
      - name: Chromium + Firefox + WebKit visual/accessibility suite
        run: npm run test:cross-browser
        env:
          BC_BASE_URL: http://127.0.0.1:4173
