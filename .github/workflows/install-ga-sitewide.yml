name: Analytics privacy guard
on:
  pull_request:
    paths: ['analytics.js', 'product-analytics.js', 'tests/static/analytics-privacy-runtime.test.mjs', '.github/workflows/install-ga-sitewide.yml']
  push:
    branches: ['dev/**', 'codex/**']
    paths: ['analytics.js', 'product-analytics.js', 'tests/static/analytics-privacy-runtime.test.mjs', '.github/workflows/install-ga-sitewide.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test tests/static/analytics-privacy-runtime.test.mjs
