name: Isolated push provider permissions
on:
  pull_request:
    paths: ['supabase/migrations/*push_subscription_provider*', 'qa/push_provider*', '.github/workflows/push-provider-permissions.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: brickcircle
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: push_provider
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U brickcircle -d push_provider"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      DSN: postgresql://brickcircle:disposable-ci-only@127.0.0.1:5432/push_provider
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          psql "$DSN" -v ON_ERROR_STOP=1 -f qa/web_push_base.sql
          psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/20260907084632_web_push_notifications.sql
          psql "$DSN" -v ON_ERROR_STOP=1 -f qa/push_provider_before.sql
          psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/20261014140000_push_subscription_provider_binding.sql
          psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/20261014140000_push_subscription_provider_binding.sql
          psql "$DSN" -v ON_ERROR_STOP=1 -f qa/push_provider_after.sql
          psql "$DSN" -v ON_ERROR_STOP=1 -f supabase/tests/web_push_notifications.sql
