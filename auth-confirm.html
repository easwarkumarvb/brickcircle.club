<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>BrickCircle email confirmation</title>
</head>
<body>
  <p>Opening secure BrickCircle confirmation… <a href="/v2.html#verify">Continue to BrickCircle</a></p>
  <script>
  // Compatibility handoff only: no client, credentials, writes or success claim.
  // Never honor a caller-supplied redirect destination.
  (()=>{
    const source=new URL(location.href),target=new URL('/v2.html',location.origin);
    for(const name of ['code','token_hash','type','error','error_code']){
      const value=source.searchParams.get(name);if(value)target.searchParams.set(name,value);
    }
    const fragment=new URLSearchParams(source.hash.slice(1)),safe=new URLSearchParams();
    for(const name of ['access_token','refresh_token','expires_in','expires_at','token_type','type','error','error_code']){
      const value=fragment.get(name);if(value)safe.set(name,value);
    }
    target.hash=safe.size?safe.toString():'verify';location.replace(target.href);
  })();
  </script>
</body>
</html>
